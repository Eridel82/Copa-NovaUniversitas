<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa NovaUniversitas 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070910;--bg2:#0d1018;--bg3:#13161f;--surface:#181c28;
  --border:rgba(255,255,255,0.06);--border-h:rgba(255,255,255,0.14);
  --blue:#5b9bff;--teal:#2dd4bf;
  --gold:#f59e0b;--silver:#94a3b8;--bronze:#cd7f32;
  --text:#eaedf5;--text-dim:#7b839c;--text-muted:#3d4259;
  --green:#34d399;--red:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* CURSOR */
.cursor{display:none;}
.cursor-ring{display:none;}

/* CANVAS */
#particleCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* GRAIN */
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9998;mix-blend-mode:overlay;}

.page-wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 24px 100px;}

/* ══════════ HERO ══════════ */
.hero{position:relative;padding:100px 0 80px;text-align:center;overflow:hidden;}

/* Concentric rings */
.hero-ring{position:absolute;border-radius:50%;pointer-events:none;top:50%;left:50%;}
.r1{width:680px;height:680px;border:1px solid rgba(91,155,255,0.07);transform:translate(-50%,-52%);animation:ringBreath 5s ease-in-out infinite;}
.r2{width:520px;height:520px;border:1px solid rgba(91,155,255,0.05);transform:translate(-50%,-52%);animation:ringBreath 5s ease-in-out 1.2s infinite;}
.r3{width:360px;height:360px;border:1px solid rgba(45,212,191,0.06);transform:translate(-50%,-52%);animation:ringBreath 5s ease-in-out 2.4s infinite;}
@keyframes ringBreath{0%,100%{opacity:.6;transform:translate(-50%,-52%) scale(1)}50%{opacity:1;transform:translate(-50%,-52%) scale(1.03)}}

/* Rotating arcs */
.arc{position:absolute;border-radius:50%;border:2px solid transparent;pointer-events:none;top:50%;left:50%;}
.arc1{width:480px;height:480px;border-top-color:rgba(91,155,255,0.5);border-right-color:rgba(91,155,255,0.1);transform:translate(-50%,-52%);animation:spin 10s linear infinite;}
.arc2{width:380px;height:380px;border-bottom-color:rgba(45,212,191,0.4);border-left-color:rgba(45,212,191,0.08);transform:translate(-50%,-52%);animation:spin 7s linear infinite reverse;}
.arc3{width:580px;height:580px;border-top-color:rgba(91,155,255,0.15);border-left-color:transparent;border-right-color:transparent;border-bottom-color:transparent;transform:translate(-50%,-52%);animation:spin 18s linear infinite;}
@keyframes spin{from{transform:translate(-50%,-52%) rotate(0)}to{transform:translate(-50%,-52%) rotate(360deg)}}

/* Dot on arc */
.arc1::before{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 14px 4px rgba(91,155,255,0.8);top:-4px;left:50%;transform:translateX(-50%);}
.arc2::before{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px 3px rgba(45,212,191,0.8);bottom:-3px;left:50%;transform:translateX(-50%);}

.hero-content{position:relative;z-index:2;}

/* BADGE */
.hero-badge{
  display:inline-flex;align-items:center;gap:10px;
  background:rgba(91,155,255,0.07);border:1px solid rgba(91,155,255,0.22);
  color:var(--blue);padding:8px 22px;border-radius:100px;
  font-size:0.72rem;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;
  margin-bottom:36px;
  animation:badgeDrop 1s cubic-bezier(.34,1.56,.64,1) both;
}
.badge-blink{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);animation:blink 1.4s ease infinite;}
@keyframes badgeDrop{from{opacity:0;transform:translateY(-24px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.5)}}

/* TITLE */
.hero h1{
  font-family:'Syne',sans-serif;
  font-size:clamp(2.4rem,7.5vw,5.6rem);
  font-weight:800;line-height:1.02;letter-spacing:-2.5px;
  color:#fff;margin-bottom:12px;
  animation:heroUp 1s cubic-bezier(.16,1,.3,1) .12s both;
  text-shadow:0 0 100px rgba(91,155,255,0.15);
  position:relative;display:inline-block;
}
/* shimmer sweep */
.hero h1::after{
  content:attr(data-text);
  position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,0.7) 50%,transparent 70%);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:sweep 3.5s ease 2s infinite;
}
@keyframes sweep{0%{background-position:200% 0}100%{background-position:-100% 0}}
@keyframes heroUp{from{opacity:0;transform:translateY(44px)}to{opacity:1;transform:translateY(0)}}

.hero-year{
  display:block;font-family:'Syne',sans-serif;font-size:clamp(.9rem,2.5vw,1.5rem);
  font-weight:700;letter-spacing:10px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--blue) 0%,var(--teal) 50%,var(--blue) 100%);
  background-size:200% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:heroUp 1s ease .28s both, gradFlow 3s linear 2s infinite;
  margin-bottom:20px;
}
@keyframes gradFlow{0%{background-position:0% 0}100%{background-position:200% 0}}

.hero-sub{color:var(--text-dim);font-size:1rem;letter-spacing:1px;animation:heroUp 1s ease .42s both;}

.hero-divider{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:38px auto;animation:heroUp 1s ease .55s both;
}
.hero-divider .dl{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--border-h));}
.hero-divider .dl:last-child{transform:scaleX(-1);}
.hero-divider .dd{width:5px;height:5px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px var(--blue);}

/* STAT PILLS */
.live-bar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:80px;animation:heroUp 1s ease .65s both;}
.stat-pill{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);
  padding:13px 22px;border-radius:100px;font-size:0.85rem;
  position:relative;overflow:hidden;
  transition:transform .5s cubic-bezier(.34,1.2,.64,1),border-color .3s,box-shadow .3s;
}
.stat-pill::after{content:'';position:absolute;inset:0;width:100%;height:100%;top:0;left:-100%;background:linear-gradient(90deg,transparent,rgba(91,155,255,0.08),transparent);transition:left .7s ease;pointer-events:none;}
.stat-pill:hover::after{left:100%;}
.stat-pill:hover{transform:translateY(-5px) scale(1.04);border-color:rgba(91,155,255,0.35);box-shadow:0 16px 50px rgba(0,0,0,0.5);}
.stat-pill .n{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--blue);}
.stat-pill .l{color:var(--text-dim);}

/* ══════════ LAYOUT ══════════ */
.section-card{background:var(--bg2);border:1px solid var(--border);border-radius:28px;padding:36px;margin-bottom:28px;position:relative;overflow:hidden;}
.section-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(91,155,255,0.018),transparent 50%);pointer-events:none;}

.sec-title{display:flex;align-items:center;gap:16px;margin-bottom:24px;}
.sec-title h2{font-family:'Syne',sans-serif;font-weight:700;font-size:1.3rem;white-space:nowrap;letter-spacing:-0.5px;}
.sec-title .line{flex:1;height:1px;background:var(--border);}
.sec-tag{font-size:0.68rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--blue);background:rgba(91,155,255,0.08);border:1px solid rgba(91,155,255,0.18);padding:5px 14px;border-radius:100px;}

/* ══════════ JORNADA ══════════ */
.jornada-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.jornada-header h3{font-family:'Syne',sans-serif;font-size:0.88rem;font-weight:700;color:var(--text-dim);letter-spacing:2.5px;text-transform:uppercase;}
.jornada-fecha{font-size:0.82rem;color:var(--blue);font-weight:500;}
.partidos-grid{display:flex;flex-direction:column;gap:16px;margin-bottom:32px;}

/* ══════════ PARTIDO CARD ══════════ */
.partido-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:32px 36px;
  position:relative;overflow:hidden;
  transition:transform .5s cubic-bezier(.34,1.1,.64,1),border-color .4s,box-shadow .4s;
}

.partido-card .card-inner{position:relative;z-index:1;}

/* top shimmer line */
.partido-card::after{content:'';position:absolute;top:0;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:.5;}
.partido-card:hover{transform:translateY(-8px) scale(1.008);border-color:rgba(91,155,255,0.35);box-shadow:0 24px 60px rgba(0,0,0,0.5);}

/* spotlight */
.card-spotlight{display:none;}

.cat-label{font-size:0.68rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--blue);margin-bottom:24px;display:flex;align-items:center;gap:8px;}
.cat-label::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue);animation:blink 2s ease infinite;}

.partido-equipos{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px;}
.equipo-col{flex:1;}.equipo-col.right{text-align:right;}
.equipo-emoji{font-size:2.8rem;display:inline-block;margin-bottom:10px;line-height:1;transition:transform .5s cubic-bezier(.34,1.56,.64,1);}
.partido-card:hover .equipo-emoji{transform:scale(1.25) rotate(-6deg);}

.equipo-nombre{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1rem,2.2vw,1.4rem);color:var(--text);line-height:1.2;letter-spacing:-0.3px;}

.vs-orb{
  width:62px;height:62px;border-radius:50%;
  background:var(--bg3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:800;color:var(--text-muted);
  flex-shrink:0;position:relative;
  transition:transform .7s cubic-bezier(.34,1.1,.64,1),box-shadow .4s;
}
.partido-card:hover .vs-orb{transform:scale(1.18);box-shadow:0 0 24px rgba(91,155,255,0.3);border-color:rgba(91,155,255,0.4);}

.partido-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--border);}
.meta-row{display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--text-dim);background:var(--bg3);padding:8px 16px;border-radius:100px;border:1px solid var(--border);transition:border-color .3s,color .3s,transform .3s;}
.meta-row:hover{border-color:rgba(91,155,255,0.3);color:var(--text);transform:scale(1.03);}

/* ══════════ TABLAS ══════════ */
.tablas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px;margin-bottom:28px;}
.tabla-card{background:var(--bg2);border:1px solid var(--border);border-radius:24px;overflow:hidden;transition:border-color .4s,box-shadow .4s,transform .4s cubic-bezier(.34,1.1,.64,1);}
.tabla-card:hover{border-color:rgba(91,155,255,0.25);box-shadow:0 20px 60px rgba(0,0,0,0.4);transform:translateY(-4px);}
.tabla-top{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.tabla-top h3{font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem;}
table{width:100%;border-collapse:collapse;}
thead th{padding:11px 14px;font-size:0.66rem;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-muted);text-align:center;background:var(--bg3);}
thead th:nth-child(2){text-align:left;padding-left:18px;}
tbody td{padding:13px 14px;text-align:center;font-size:0.88rem;color:var(--text-dim);border-bottom:1px solid rgba(255,255,255,0.03);transition:color .2s;}
tbody td:nth-child(2){text-align:left;padding-left:18px;}
tbody tr{transition:background .25s;}
tbody tr:hover{background:rgba(91,155,255,0.04);}
tbody tr:hover td{color:var(--text);}
tbody tr:last-child td{border-bottom:none;}
.pos-num{font-family:'Syne',sans-serif;font-weight:700;font-size:0.85rem;color:var(--text-muted);}
.equipo-td{display:flex;align-items:center;gap:9px;font-weight:500;color:var(--text);font-size:0.88rem;}
.pos-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pts-td{font-family:'Syne',sans-serif;font-weight:800;font-size:1.05rem;color:var(--blue);}
.dg-pos{color:var(--green)}.dg-neg{color:var(--red)}.dg-zero{color:var(--text-muted)}
.leader-row td{background:rgba(91,155,255,0.05);}
.leader-row:hover td{background:rgba(91,155,255,0.09);}

/* ══════════ GOLEADORES ══════════ */
.goles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px;margin-bottom:28px;}
.goles-card{background:var(--bg2);border:1px solid var(--border);border-radius:24px;overflow:hidden;transition:border-color .4s,box-shadow .4s,transform .4s cubic-bezier(.34,1.1,.64,1);}
.goles-card:hover{border-color:rgba(91,155,255,0.25);box-shadow:0 20px 60px rgba(0,0,0,0.4);transform:translateY(-4px);}
.goles-top{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.goles-top h3{font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem;}
.goles-list{padding:6px 0;}

.gol-row{
  display:flex;align-items:center;gap:14px;padding:13px 22px;
  border-bottom:1px solid rgba(255,255,255,0.03);
  position:relative;overflow:hidden;cursor:default;
  opacity:0;transform:translateX(-24px);
  transition:opacity .5s ease, transform .5s cubic-bezier(.34,1.1,.64,1), background .25s;
}
.gol-row.row-visible{opacity:1;transform:translateX(0);}
.gol-row.row-visible:hover{background:rgba(91,155,255,0.04);transform:translateX(5px);}
.gol-row:last-child{border-bottom:none;}

/* left accent */
.gol-row::before{content:'';position:absolute;left:0;top:18%;bottom:18%;width:2.5px;border-radius:2px;}
.rank-1::before{background:var(--gold);box-shadow:0 0 12px var(--gold);}
.rank-2::before{background:var(--silver);box-shadow:0 0 8px var(--silver);}
.rank-3::before{background:var(--bronze);box-shadow:0 0 8px var(--bronze);}

/* tinted bg top3 */
.rank-1{background:linear-gradient(90deg,rgba(245,158,11,0.05) 0%,transparent 65%);}
.rank-2{background:linear-gradient(90deg,rgba(148,163,184,0.04) 0%,transparent 65%);}
.rank-3{background:linear-gradient(90deg,rgba(205,127,50,0.04) 0%,transparent 65%);}

.rank-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:0.78rem;flex-shrink:0;background:var(--bg3);border:1px solid var(--border);color:var(--text-muted);transition:transform .5s cubic-bezier(.34,1.56,.64,1);}
.gol-row.row-visible:hover .rank-badge{transform:scale(1.2) rotate(-10deg);}
.rank-1 .rank-badge{background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.4);color:var(--gold);}
.rank-2 .rank-badge{background:rgba(148,163,184,0.1);border-color:rgba(148,163,184,0.35);color:var(--silver);}
.rank-3 .rank-badge{background:rgba(205,127,50,0.1);border-color:rgba(205,127,50,0.35);color:var(--bronze);}

.gol-info{flex:1;min-width:0;}
.gol-name{font-weight:600;color:var(--text);font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gol-team{font-size:0.75rem;color:var(--text-muted);margin-top:2px;}

.gol-bar-wrap{flex:1;height:4px;background:var(--bg3);border-radius:3px;overflow:hidden;max-width:90px;}
.gol-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--teal));width:0%;transition:width 1.2s cubic-bezier(.23,1,.32,1);}

.gol-count{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:62px;height:62px;border-radius:14px;
  background:var(--bg3);border:1px solid rgba(91,155,255,0.2);
  position:relative;overflow:hidden;
  transition:transform .5s cubic-bezier(.34,1.56,.64,1),box-shadow .4s;
}
.gol-count::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(91,155,255,0.08),transparent);pointer-events:none;}
.gol-row.row-visible:hover .gol-count{transform:scale(1.14);box-shadow:0 8px 28px rgba(91,155,255,0.2);}
.gol-count .gol-num{font-family:'Syne',sans-serif;font-weight:800;font-size:1.65rem;line-height:1;color:var(--blue);position:relative;z-index:1;}
.gol-count .gol-lbl{font-size:0.52rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);position:relative;z-index:1;margin-top:1px;}

/* top 3 gold/silver/bronze counts */
.rank-1 .gol-count{background:rgba(245,158,11,0.08);border-color:rgba(245,158,11,0.35);animation:goldGlow 2.5s ease 2.5s infinite;}
.rank-1 .gol-count::before{background:linear-gradient(135deg,rgba(245,158,11,0.13),transparent);}
.rank-1 .gol-count .gol-num{color:var(--gold);}
.rank-1.row-visible:hover .gol-count{box-shadow:0 8px 28px rgba(245,158,11,0.25);}

.rank-2 .gol-count{background:rgba(148,163,184,0.07);border-color:rgba(148,163,184,0.28);}
.rank-2 .gol-count::before{background:linear-gradient(135deg,rgba(148,163,184,0.08),transparent);}
.rank-2 .gol-count .gol-num{color:var(--silver);}

.rank-3 .gol-count{background:rgba(205,127,50,0.07);border-color:rgba(205,127,50,0.28);}
.rank-3 .gol-count::before{background:linear-gradient(135deg,rgba(205,127,50,0.08),transparent);}
.rank-3 .gol-count .gol-num{color:var(--bronze);}

@keyframes goldGlow{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 24px 6px rgba(245,158,11,0.2),0 0 48px 12px rgba(245,158,11,0.06)}}

/* FOOTER */
footer{text-align:center;padding:44px 20px;color:var(--text-muted);font-size:0.78rem;letter-spacing:2px;text-transform:uppercase;position:relative;z-index:1;}
footer::before{content:'';display:block;width:30px;height:1px;background:var(--border);margin:0 auto 20px;}

/* SCROLL REVEAL */
.reveal{opacity:0;transform:translateY(40px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);}
.reveal.visible{opacity:1;transform:translateY(0);}

/* RESPONSIVE */
@media(max-width:900px){.tablas-grid,.goles-grid{grid-template-columns:1fr;}}
@media(max-width:600px){
  body{cursor:auto;}.cursor,.cursor-ring{display:none;}
  .page-wrap{padding:0 14px 64px;}
  .hero{padding:56px 0 40px;}
  .r1,.r2,.r3,.arc1,.arc2,.arc3{display:none;}
  .live-bar{gap:8px;margin-bottom:48px;}
  .stat-pill{padding:10px 14px;font-size:.78rem;}
  .stat-pill .n{font-size:1rem;}
  .section-card{padding:20px 16px;border-radius:20px;}
  .partidos-grid{gap:12px;}
  .partido-card{padding:20px 18px;border-radius:18px;}
  .partido-equipos{gap:8px;}
  .equipo-emoji{font-size:2rem;}
  .equipo-nombre{font-size:.88rem;}
  .vs-orb{width:46px;height:46px;font-size:.75rem;}
  .partido-meta{flex-direction:column;align-items:flex-start;gap:8px;padding-top:16px;}
  .meta-row{width:100%;font-size:.8rem;}
  .tablas-grid,.goles-grid{gap:14px;}
  .tabla-card table{display:block;overflow-x:auto;}
  thead th{padding:9px;font-size:.62rem;white-space:nowrap;}
  tbody td{padding:11px 9px;font-size:.8rem;white-space:nowrap;}
  tbody td:nth-child(2){padding-left:10px;white-space:normal;min-width:110px;}
  .gol-row{padding:11px 14px;gap:10px;}
  .gol-bar-wrap{display:none;}
  .gol-count{min-width:52px;height:52px;border-radius:11px;}
  .gol-count .gol-num{font-size:1.35rem;}
}
@media(max-width:380px){
  .equipo-nombre{font-size:.8rem;}
  .vs-orb{width:38px;height:38px;font-size:.65rem;}
  .equipo-emoji{font-size:1.7rem;}
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--surface);border-radius:3px;}

/* FINALES CARDS */
.finales-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
  gap: 20px;
  margin-bottom: 28px;
}
.final-card {
  background: var(--bg2);
  border-radius: 24px;
  overflow: hidden;
  position: relative;
  transition: transform .5s cubic-bezier(.34,1.1,.64,1), box-shadow .4s, border-color .4s;
}
.final-card.femenil {
  border: 1px solid rgba(245,158,11,0.35);
  background: linear-gradient(135deg, rgba(245,158,11,0.06) 0%, rgba(45,212,191,0.03) 100%);
}
.final-card.varonil {
  border: 1px solid rgba(248,113,113,0.35);
  background: linear-gradient(135deg, rgba(248,113,113,0.06) 0%, rgba(91,155,255,0.03) 100%);
}
.final-card.femenil::after { content:''; position:absolute; top:0; left:10%; right:10%; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); pointer-events:none; }
.final-card.varonil::after { content:''; position:absolute; top:0; left:10%; right:10%; height:1px; background:linear-gradient(90deg,transparent,var(--red),transparent); pointer-events:none; }
.final-card.femenil:hover { transform: translateY(-8px); box-shadow: 0 24px 80px rgba(245,158,11,0.2); border-color: rgba(245,158,11,0.65); }
.final-card.varonil:hover { transform: translateY(-8px); box-shadow: 0 24px 80px rgba(248,113,113,0.2); border-color: rgba(248,113,113,0.65); }
.final-top-label {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 20px 0;
  font-size: 0.66rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
}
.final-card.femenil .final-top-label { color: var(--gold); }
.final-card.varonil .final-top-label { color: var(--red); }
.final-top-label::before { content:''; width:5px; height:5px; border-radius:50%; animation:blink 2s ease infinite; flex-shrink:0; }
.final-card.femenil .final-top-label::before { background:var(--gold); box-shadow:0 0 10px var(--gold); }
.final-card.varonil .final-top-label::before { background:var(--red); box-shadow:0 0 10px var(--red); }
.final-img-wrap {
  padding: 12px 18px 16px;
  display: flex; justify-content: center;
}
.final-img-wrap img {
  width: 100%; border-radius: 16px;
  box-shadow: 0 12px 50px rgba(0,0,0,0.65);
  transition: transform .5s cubic-bezier(.34,1.1,.64,1);
}
.final-card:hover .final-img-wrap img { transform: scale(1.016); }
.final-info {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 0 18px 18px;
}
.final-info .meta-row { font-size: 0.78rem; padding: 6px 13px; }

/* FASE FINAL BUTTON */
.fase-final-btn-wrap { display: flex; justify-content: center; margin: 8px 0 36px; }
.fase-final-btn {
  display: inline-flex; align-items: center; gap: 12px;
  background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(91,155,255,0.08));
  border: 1px solid rgba(245,158,11,0.5);
  color: var(--gold);
  padding: 16px 38px; border-radius: 100px;
  font-family: 'Syne', sans-serif; font-size: 0.88rem; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
  position: relative; overflow: hidden;
  transition: transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .4s, border-color .4s;
  cursor: pointer;
}
.fase-final-btn::before { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(245,158,11,0.15),transparent); left:-100%; transition:left .6s ease; pointer-events:none; }
.fase-final-btn:hover::before { left:100%; }
.fase-final-btn:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 16px 50px rgba(245,158,11,0.3); border-color: rgba(245,158,11,0.9); }
.fase-final-btn .btn-icon { font-size: 1.2rem; transition: transform .4s cubic-bezier(.34,1.56,.64,1); }
.fase-final-btn:hover .btn-icon { transform: scale(1.3) rotate(-8deg); }
.fase-final-btn .arr-icon { transition: transform .3s ease; }
.fase-final-btn:hover .arr-icon { transform: translateX(6px); }

@media(max-width:600px){
  .finales-grid { grid-template-columns: 1fr; gap: 14px; }
  .final-info { flex-direction: column; align-items: flex-start; }
  .final-info .meta-row { width: 100%; }
  .fase-final-btn { padding: 13px 24px; font-size: .8rem; }
}

</style>
</head>

/* PARTICLES */
(function(){
  const cv=document.getElementById('particleCanvas'),ctx=cv.getContext('2d');
  let W,H,pts=[];
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  const cols=['rgba(91,155,255,','rgba(45,212,191,','rgba(91,155,255,'];
  const r=(a,b)=>Math.random()*(b-a)+a;
  for(let i=0;i<70;i++)pts.push({x:r(0,W),y:r(0,H),vx:r(-0.25,0.25),vy:r(-0.5,-0.08),rad:r(.5,2.5),col:cols[0|r(0,3)],alpha:r(.1,.45),life:r(0,1),spd:r(.003,.009)});
  let mx=W/2,my=H/2;
  window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  (function frame(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.life+=p.spd;if(p.life>1){p.life=0;p.y=H+10;p.x=r(0,W);}
      const a=Math.sin(p.life*Math.PI)*p.alpha;
      ctx.beginPath();ctx.arc(p.x,p.y,p.rad,0,Math.PI*2);
      ctx.fillStyle=p.col+a+')';ctx.fill();
      p.x+=p.vx;p.y+=p.vy;
      const dx=mx-p.x,dy=my-p.y,dist=Math.hypot(dx,dy);
      if(dist<180){p.x+=dx*0.00035;p.y+=dy*0.00035;}
    });
    requestAnimationFrame(frame);
  })();
})();

  (function lp(){rx+=(cx-rx)*.12;ry+=(cy-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(lp);})();

}

/* COUNTER */
function animNum(el,target,dur=1100){
  let s=null;
  const step=ts=>{
    if(!s)s=ts;
    const p=Math.min((ts-s)/dur,1),ease=1-Math.pow(1-p,4);
    el.textContent=Math.round(ease*target);
    if(p<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* CALC */
function calcTabla(nms,grp){
  const t=nms.map(n=>({nombre:n,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,dg:0,puntos:0,enf:{}}));
  resultadosPartidos.filter(r=>r.grupo===grp).forEach(r=>{
    const e1=t.find(e=>e.nombre===r.equipo1),e2=t.find(e=>e.nombre===r.equipo2);
    if(!e1)return;
    if(!e2){e1.pj++;e1.gf+=r.goles1;e1.gc+=(r.goles2||0);e1.pg++;e1.puntos+=3;return;}
    e1.pj++;e2.pj++;e1.gf+=r.goles1;e1.gc+=r.goles2;e2.gf+=r.goles2;e2.gc+=r.goles1;
    if(r.goles1>r.goles2){e1.pg++;e1.puntos+=3;e2.pp++;e1.enf[e2.nombre]='W';e2.enf[e1.nombre]='L';}
    else if(r.goles1<r.goles2){e2.pg++;e2.puntos+=3;e1.pp++;e2.enf[e1.nombre]='W';e1.enf[e2.nombre]='L';}
    else{e1.pe++;e2.pe++;e1.puntos+=2;e2.puntos++;e1.enf[e2.nombre]='D';e2.enf[e1.nombre]='D';}
  });
  t.forEach(e=>e.dg=e.gf-e.gc);
  t.sort((a,b)=>{
    if(b.puntos!==a.puntos)return b.puntos-a.puntos;
    if(b.dg!==a.dg)return b.dg-a.dg;
    if(b.gf!==a.gf)return b.gf-a.gf;
    if(a.enf[b.nombre])return a.enf[b.nombre]==='W'?-1:1;
    return 0;
  });
  return t;
}

/* RENDERS */
function renderTabla(t,titulo,fem){
  const rows=t.map((e,i)=>{
    const dot=dotColors[e.nombre]||'#5b9bff';
    const dg=e.dg>0?`<span class="dg-pos">+${e.dg}</span>`:e.dg<0?`<span class="dg-neg">${e.dg}</span>`:`<span class="dg-zero">0</span>`;
    return `<tr class="${i===0?'leader-row':''}"><td><span class="pos-num">${i+1}</span></td><td><div class="equipo-td"><div class="pos-dot" style="background:${dot}"></div>${e.nombre}</div></td><td>${e.gf}</td><td>${e.gc}</td><td>${dg}</td><td class="pts-td">${e.puntos}</td></tr>`;
  }).join('');
  return `<div class="tabla-card reveal"><div class="tabla-top"><h3>${titulo}</h3><span class="sec-tag">${fem?'👩':'⚽'} ${fem?'Femenil':'Varonil'}</span></div><table><thead><tr><th>#</th><th>Equipo</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderGoleadores(arr,titulo,fem){
  arr=[...arr].sort((a,b)=>b.goles-a.goles);
  const max=arr.length?arr[0].goles:1;
  const rm=['rank-1','rank-2','rank-3'];
  const body=arr.length?`<div class="goles-list">`+arr.slice(0,10).map((g,i)=>{
    const pct=Math.round((g.goles/max)*100);
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
    return `<div class="gol-row ${rm[i]||''}" data-delay="${i*90}"><div class="rank-badge">${medal}</div><div class="gol-info"><div class="gol-name">${g.nombre}</div><div class="gol-team">${g.equipo}</div></div><div class="gol-bar-wrap"><div class="gol-bar" data-width="${pct}%" style="width:0%"></div></div><div class="gol-count"><span class="gol-num" data-count="${g.goles}">0</span><span class="gol-lbl">goles</span></div></div>`;
  }).join('')+`</div>`:`<div class="empty-state"><span class="e-icon">⚽</span>Sin goles aún</div>`;
  return `<div class="goles-card reveal"><div class="goles-top"><h3>${titulo}</h3><span class="sec-tag">${fem?'👩':'⚽'} ${fem?'Femenil':'Varonil'}</span></div>${body}</div>`;
}

function renderPartidos(){
  const jns={};partidos.forEach(p=>{if(!jns[p.jornada])jns[p.jornada]=[];jns[p.jornada].push(p);});
  let html='';
  Object.keys(jns).sort((a,b)=>a-b).forEach(num=>{
    const lista=jns[num];
    html+=`<div class="jornada-header"><h3>Jornada ${num}</h3><span class="jornada-fecha">📅 ${lista[0].fecha}</span></div><div class="partidos-grid">`;
    lista.forEach((p,pi)=>{
      html+=`<div class="partido-card reveal" style="transition-delay:${pi*.1}s"><div class="card-inner">
        <span class="cat-label">${p.categoria==='femenil'?'Femenil':'Varonil'}</span>
        <div class="partido-equipos">
          <div class="equipo-col"><span class="equipo-emoji">${p.emoji1}</span><div class="equipo-nombre">${p.equipo1}</div></div>
          <div class="vs-orb">VS</div>
          <div class="equipo-col right"><span class="equipo-emoji" style="display:inline-block">${p.emoji2}</span><div class="equipo-nombre">${p.equipo2}</div></div>
        </div>
        <div class="partido-meta">
          <div class="meta-row"><span>⏰</span>${p.hora}</div>
          <div class="meta-row"><span>🧑‍⚖️</span>Árbitro: ${p.arbitro}</div>
        </div>
      </div></div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('contenedorJornadas').innerHTML=html;
}

function renderLiveBar(tV,tF){
  const gV=tV.reduce((s,e)=>s+e.gf,0),gF=tF.reduce((s,e)=>s+e.gf,0);
  const data=[
    {n:resultadosPartidos.length,l:'Partidos jugados'},
    {n:equiposVaronil.length+equiposFemenil.length,l:'Equipos'},
    {n:gV+gF,l:'Goles totales'},
    {n:partidos.length,l:'Próximos partidos'},
  ];
  document.getElementById('liveBar').innerHTML=data.map(d=>`<div class="stat-pill"><span class="n" data-count="${d.n}">0</span><span class="l">${d.l}</span></div>`).join('');
  document.querySelectorAll('.live-bar .n').forEach((el,i)=>{
    setTimeout(()=>animNum(el,+el.dataset.count,900),750+i*180);
  });
}

/* INIT */
const tV=calcTabla(equiposVaronil,'Varonil'),tF=calcTabla(equiposFemenil,'Femenil');
renderPartidos();renderLiveBar(tV,tF);
document.getElementById('tablasGrid').innerHTML=renderTabla(tV,'Tabla General',false)+renderTabla(tF,'Tabla General',true);
document.getElementById('golesGrid').innerHTML=renderGoleadores(goleadores,'Goleador',false)+renderGoleadores(goleadoras,'Goleadora',true);
initSpotlights();

/* SCROLL REVEAL */
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const delay=parseFloat(e.target.style.transitionDelay||'0')*1000;
      setTimeout(()=>e.target.classList.add('visible'),delay);
      obs.unobserve(e.target);
    }
  });
},{threshold:.05,rootMargin:'0px 0px -30px 0px'});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

/* GOL ROWS REVEAL */
const rowObs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.querySelectorAll('.gol-row').forEach(row=>{
        const d=+row.dataset.delay||0;
        setTimeout(()=>{
          row.classList.add('row-visible');
          const bar=row.querySelector('.gol-bar');if(bar)bar.style.width=bar.dataset.width;
          const num=row.querySelector('.gol-num');if(num)animNum(num,+num.dataset.count,900);
        },d);
      });
      rowObs.unobserve(e.target);
    }
  });
},{threshold:.08});
document.querySelectorAll('.goles-card').forEach(c=>rowObs.observe(c));
</script>
</body>
