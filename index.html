<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa NovaUniversitas</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Inter", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }

  .header {
    text-align: center;
    color: white;
    padding: 40px 20px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    max-width: 1200px;
    margin: 0 auto 40px;
  }

  .header h1 {
    font-size: 3em;
    font-weight: 800;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    letter-spacing: -1px;
  }

  .header .subtitle {
    font-size: 1.2em;
    opacity: 0.9;
    font-weight: 300;
  }

  .trophy-icon {
    font-size: 4em;
    margin-bottom: 15px;
    animation: bounce 2s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* TABLAS */
  .grupo-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto 50px;
  }

  .tabla {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
  }

  .tabla:hover {
    transform: translateY(-5px);
  }

  .tabla-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 25px;
    font-size: 1.5em;
    font-weight: 700;
    text-align: center;
    letter-spacing: 1px;
  }

  .tabla-header.femenina {
    background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead {
    background: #f8f9fa;
  }

  th {
    padding: 15px 10px;
    text-align: center;
    font-weight: 600;
    color: #495057;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  td {
    padding: 15px 10px;
    text-align: center;
    border-bottom: 1px solid #f0f0f0;
    color: #333;
  }

  tbody tr {
    transition: all 0.2s ease;
  }

  tbody tr:hover {
    background: #f8f9ff;
  }

  tbody tr:first-child {
    background: linear-gradient(90deg, #fff3cd 0%, #ffffff 100%);
    font-weight: 600;
  }

  .tabla.femenina tbody tr:first-child {
    background: linear-gradient(90deg, #fce7f3 0%, #ffffff 100%);
    font-weight: 600;
  }

  tbody tr:nth-child(2) {
    background: linear-gradient(90deg, #e7f3ff 0%, #ffffff 100%);
    font-weight: 500;
  }

  .tabla.femenina tbody tr:nth-child(2) {
    background: linear-gradient(90deg, #fbcfe8 0%, #ffffff 100%);
    font-weight: 500;
  }

  .equipo-cell {
    text-align: left;
    font-weight: 600;
    color: #2c3e50;
  }

  .pts-cell {
    font-weight: 700;
    font-size: 1.1em;
    color: #667eea;
  }

  .tabla.femenina .pts-cell {
    color: #ec4899;
  }

  /* PARTIDOS */
  .partidos-section {
    max-width: 1200px;
    background: white;
    margin: 0 auto 50px;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .section-header {
    text-align: center;
    margin-bottom: 30px;
    color: #2c3e50;
    font-size: 2em;
    font-weight: 700;
  }

  .jornada-titulo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    margin-top: 10px;
  }

  .jornada-titulo h3 {
    font-size: 1.3em;
    color: #2c3e50;
    font-weight: 700;
  }

  .fecha-jornada {
    font-size: 0.95em;
    color: #667eea;
    font-weight: 600;
  }

  .partidos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .partido-card {
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    padding: 20px;
    border-radius: 15px;
    border-left: 4px solid #667eea;
    transition: all 0.3s ease;
  }

  .partido-card.femenino {
    background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%);
    border-left: 4px solid #ec4899;
  }

  .partido-card:hover {
    transform: translateX(5px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    border-left-color: #764ba2;
  }

  .partido-card.femenino:hover {
    border-left-color: #be185d;
  }

  .partido-equipos {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
    gap: 8px;
  }

  .partido-equipos .equipo-nombre {
    font-weight: 700;
    color: #2c3e50;
    flex: 1;
    font-size: 0.95em;
  }

  .vs-badge {
    background: #667eea;
    color: white;
    padding: 5px 15px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 0.85em;
    margin: 0 10px;
    flex-shrink: 0;
  }

  .partido-card.femenino .vs-badge {
    background: #ec4899;
  }

  .partido-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
    color: #6c757d;
    font-size: 0.88em;
    padding-top: 10px;
    border-top: 1px solid #dee2e6;
    line-height: 1.6;
  }

  /* GOLEADORES */
  .goleadores-section {
    max-width: 1200px;
    background: white;
    margin: 0 auto 50px;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .goleadores-section.femenina {
    background: linear-gradient(135deg, #fff5f7 0%, #ffffff 100%);
  }

  .goleadores-stats {
    display: flex;
    justify-content: space-around;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 15px;
    margin-bottom: 30px;
  }

  .stat-box { text-align: center; }

  .stat-number {
    font-size: 2em;
    font-weight: bold;
    color: #667eea;
  }

  .goleadores-section.femenina .stat-number { color: #ec4899; }

  .stat-label {
    color: #6c757d;
    font-size: 0.9em;
    margin-top: 5px;
  }

  .goleadores-table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .goleadores-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
  }

  .goleadores-table thead {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
  }

  .goleadores-section.femenina .goleadores-table thead {
    background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
  }

  .goleadores-table th {
    padding: 15px;
    text-align: left;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 14px;
    color: white;
  }

  .goleadores-table td {
    padding: 15px;
    border-bottom: 1px solid #e9ecef;
  }

  .goleadores-table tbody tr:hover { background: #f8f9fa; }

  .goleadores-table tbody tr:nth-child(1) { background: linear-gradient(to right, #ffd70020, transparent); }
  .goleadores-table tbody tr:nth-child(2) { background: linear-gradient(to right, #c0c0c020, transparent); }
  .goleadores-table tbody tr:nth-child(3) { background: linear-gradient(to right, #cd7f3220, transparent); }

  .position-cell {
    font-weight: bold;
    color: #667eea;
    font-size: 18px;
  }

  .goleadores-section.femenina .position-cell { color: #ec4899; }

  .player-name-cell { font-weight: 600; color: #212529; }
  .team-name-cell { color: #6c757d; }

  .goals-cell {
    font-weight: bold;
    color: #28a745;
    font-size: 20px;
    text-align: center;
  }

  .goleadores-section.femenina .goals-cell { color: #e91e63; }

  .trophy-emoji { font-size: 20px; margin-left: 6px; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    body { padding: 10px; }
    .header h1 { font-size: 2em; }
    .header { padding: 30px 15px; }
    .grupo-container { grid-template-columns: 1fr; }
    .partidos-grid { grid-template-columns: 1fr; }
    .partidos-section, .goleadores-section { padding: 20px 15px; }
    .partido-card { padding: 15px; }
    .partido-equipos .equipo-nombre { font-size: 0.85em; }
    .vs-badge { padding: 4px 10px; font-size: 0.75em; margin: 0 5px; }
    .goleadores-stats { flex-direction: column; gap: 15px; }
    .goleadores-table th, .goleadores-table td { padding: 10px 8px; font-size: 13px; }
    .position-cell { font-size: 16px; }
    .goals-cell { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="trophy-icon">🏆</div>
  <h1>Copa NovaUniversitas</h1>
  <div class="subtitle">Temporada 2026 — Fase de Grupos</div>
</div>

<!-- PRÓXIMOS PARTIDOS -->
<div class="partidos-section">
  <h2 class="section-header">📅 Próximos Partidos</h2>
  <div id="contenedorJornadas"></div>
</div>

<!-- TABLAS -->
<div class="grupo-container">
  <!-- VARONIL -->
  <div class="tabla">
    <div class="tabla-header">⚽ VARONIL</div>
    <table id="tablaVaronil">
      <thead>
        <tr>
          <th>Pos</th>
          <th style="text-align:left;padding-left:20px;">Equipo</th>
          <th>GF</th>
          <th>GC</th>
          <th>DG</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- FEMENIL -->
  <div class="tabla femenina">
    <div class="tabla-header femenina">👩 FEMENIL</div>
    <table id="tablaFemenil">
      <thead>
        <tr>
          <th>Pos</th>
          <th style="text-align:left;padding-left:20px;">Equipo</th>
          <th>GF</th>
          <th>GC</th>
          <th>DG</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- GOLEADORES VARONIL -->
<div class="goleadores-section">
  <h2 class="section-header">⚽ Goleadores — Varonil</h2>
  <div class="goleadores-table-wrapper">
    <table class="goleadores-table">
      <thead>
        <tr>
          <th>Posición</th>
          <th>Jugador</th>
          <th>Equipo</th>
          <th style="text-align:center;">Goles</th>
        </tr>
      </thead>
      <tbody id="goleadoresBody"></tbody>
    </table>
  </div>
</div>

<!-- GOLEADORAS FEMENIL -->
<div class="goleadores-section femenina">
  <h2 class="section-header">⚽ Goleadoras — Femenil 👩</h2>
  <div class="goleadores-table-wrapper">
    <table class="goleadores-table">
      <thead>
        <tr>
          <th>Posición</th>
          <th>Jugadora</th>
          <th>Equipo</th>
          <th style="text-align:center;">Goles</th>
        </tr>
      </thead>
      <tbody id="goleadorasBody"></tbody>
    </table>
  </div>
</div>

<script>
  // =============================================
  // 📊 RESULTADOS — agregar aquí conforme se jueguen
  // =============================================
  const resultadosPartidos = [
    // Ejemplo: { equipo1: "Warriors SF", goles1: 2, equipo2: "Sunderland FC", goles2: 1, grupo: "Varonil" }
  ];

  // =============================================
  // 👕 EQUIPOS
  // =============================================
  const equiposVaronil  = ["Warriors SF", "Sunderland FC", "Atlético San Luis", "Niños del Campo"];
  const equiposFemenil  = ["Las Chicas Súper Poderosas", "Agronenas", "Fénix FC"];

  // =============================================
  // ⚙️ CÁLCULO DE TABLA
  // =============================================
  function calcularTabla(equiposNombres, grupoNombre) {
    const tabla = equiposNombres.map(nombre => ({
      nombre, pj:0, pg:0, pe:0, pp:0, gf:0, gc:0, dg:0, puntos:0, enfrentamientos:{}
    }));

    resultadosPartidos
      .filter(r => r.grupo === grupoNombre)
      .forEach(r => {
        const e1 = tabla.find(e => e.nombre === r.equipo1);
        const e2 = tabla.find(e => e.nombre === r.equipo2);
        if (!e1) return;
        if (!e2) {
          e1.pj++; e1.gf += r.goles1; e1.gc += r.goles2 || 0; e1.pg++; e1.puntos += 3;
          return;
        }
        e1.pj++; e2.pj++;
        e1.gf += r.goles1; e1.gc += r.goles2;
        e2.gf += r.goles2; e2.gc += r.goles1;

        if (r.goles1 > r.goles2) {
          e1.pg++; e1.puntos += 3; e2.pp++;
          e1.enfrentamientos[e2.nombre] = 'W'; e2.enfrentamientos[e1.nombre] = 'L';
        } else if (r.goles1 < r.goles2) {
          e2.pg++; e2.puntos += 3; e1.pp++;
          e2.enfrentamientos[e1.nombre] = 'W'; e1.enfrentamientos[e2.nombre] = 'L';
        } else {
          e1.pe++; e2.pe++; e1.puntos += 1; e2.puntos += 1;
          e1.enfrentamientos[e2.nombre] = 'D'; e2.enfrentamientos[e1.nombre] = 'D';
        }
      });

    tabla.forEach(e => e.dg = e.gf - e.gc);
    return tabla;
  }

  // =============================================
  // 🥅 GOLEADORES — agregar aquí
  // =============================================
  const goleadores = [
    // { nombre: "Jugador", equipo: "Warriors SF", goles: 3 }
  ];

  const goleadoras = [
    // { nombre: "Jugadora", equipo: "Agronenas", goles: 2 }
  ];

  // =============================================
  // 🏗️ RENDER TABLAS
  // =============================================
  function ordenarYMostrar(grupo, tablaId, esFem) {
    grupo.sort((a, b) => {
      if (b.puntos !== a.puntos) return b.puntos - a.puntos;
      if (b.dg !== a.dg) return b.dg - a.dg;
      if (b.gf !== a.gf) return b.gf - a.gf;
      if (a.enfrentamientos[b.nombre]) {
        if (a.enfrentamientos[b.nombre] === 'W') return -1;
        if (a.enfrentamientos[b.nombre] === 'L') return 1;
      }
      return 0;
    });

    const tbody = document.querySelector(`#${tablaId} tbody`);
    tbody.innerHTML = "";
    grupo.forEach((e, i) => {
      tbody.innerHTML += `
        <tr>
          <td>${i + 1}</td>
          <td class="equipo-cell" style="text-align:left;padding-left:20px;">${e.nombre}</td>
          <td>${e.gf}</td>
          <td>${e.gc}</td>
          <td>${e.dg > 0 ? '+' : ''}${e.dg}</td>
          <td class="pts-cell">${e.puntos}</td>
        </tr>`;
    });
  }

  // =============================================
  // 🏗️ RENDER GOLEADORES
  // =============================================
  function renderGoleadores(arr, bodyId) {
    arr.sort((a, b) => b.goles - a.goles);
    const tbody = document.getElementById(bodyId);

    if (arr.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#999;padding:40px;">Sin goles registrados aún</td></tr>`;
    } else {
      tbody.innerHTML = arr.slice(0, 10).map((g, i) => {
        const trofeo = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        return `<tr>
          <td class="position-cell">#${i + 1} <span class="trophy-emoji">${trofeo}</span></td>
          <td class="player-name-cell">${g.nombre}</td>
          <td class="team-name-cell">${g.equipo}</td>
          <td class="goals-cell">${g.goles}</td>
        </tr>`;
      }).join('');
    }


  }

  // =============================================
  // 📅 PARTIDOS PROGRAMADOS
  // =============================================
  const coloresEquipos = {
    "Warriors SF":                   "blanca",
    "Sunderland FC":                 "roja",
    "Atlético San Luis":             "azul",
    "Niños del Campo":               "negra",
    "Las Chicas Súper Poderosas":    "rosa",
    "Agronenas":                     "azul",
    "Fénix FC":                      "rosa"
  };

  const emojiCamisa = { blanca:"⚪", negra:"⚫", rosa:"🩷", azul:"🔵", roja:"🔴" };

  function getEmoji(equipo) {
    return emojiCamisa[coloresEquipos[equipo] || "blanca"];
  }

  const partidos = [
    {
      jornada: 1,
      fecha: "Jueves 13 de Febrero",
      equipo1: "Agronenas",
      color1: "azul",
      equipo2: "Fénix FC",
      color2: "rosa",
      hora: "2:00 pm – 3:00 pm",
      arbitro: "Pendiente",
      categoria: "femenil"
    },
    {
      jornada: 1,
      fecha: "Jueves 13 de Febrero",
      equipo1: "Atlético San Luis",
      color1: "azul",
      equipo2: "Niños del Campo",
      color2: "negra",
      hora: "3:00 pm – 4:00 pm",
      arbitro: "Warriors SF",
      categoria: "varonil"
    }
  ];

  // =============================================
  // 🏗️ RENDER PARTIDOS
  // =============================================
  const jornadas = {};
  partidos.forEach(p => {
    if (!jornadas[p.jornada]) jornadas[p.jornada] = [];
    jornadas[p.jornada].push(p);
  });

  const contenedor = document.getElementById("contenedorJornadas");

  Object.keys(jornadas).sort().forEach(num => {
    const lista = jornadas[num];
    const fecha = lista[0].fecha;

    let html = `
      <div class="jornada-titulo">
        <h3>🏅 Jornada ${num}</h3>
        <span class="fecha-jornada">📅 ${fecha}</span>
      </div>
      <div class="partidos-grid">`;

    lista.forEach(p => {
      const clsCategoria = p.categoria === "femenil" ? "femenino" : "";
      const emoji1 = emojiCamisa[p.color1] || "⚪";
      const emoji2 = emojiCamisa[p.color2] || "⚪";
      html += `
        <div class="partido-card ${clsCategoria}">
          <div class="partido-equipos">
            <div class="equipo-nombre">${emoji1} ${p.equipo1}</div>
            <div class="vs-badge">VS</div>
            <div class="equipo-nombre" style="text-align:right;">${p.equipo2} ${emoji2}</div>
          </div>
          <div class="partido-info">
            <span>⏰ ${p.hora}</span>
            <span>🧑‍⚖️ Árbitro: ${p.arbitro}</span>
          </div>
        </div>`;
    });

    html += `</div>`;
    contenedor.innerHTML += html;
  });

  // =============================================
  // 🚀 INICIALIZAR
  // =============================================
  const tablaVaronil  = calcularTabla(equiposVaronil,  "Varonil");
  const tablaFem      = calcularTabla(equiposFemenil,  "Femenil");

  ordenarYMostrar(tablaVaronil, "tablaVaronil",  false);
  ordenarYMostrar(tablaFem,     "tablaFemenil",  true);

  renderGoleadores(goleadores,  "goleadoresBody");
  renderGoleadores(goleadoras,  "goleadorasBody");
</script>

</body>
<footer style="text-align: center; color: rgba(255,255,255,0.7); padding: 20px; font-size: 0.9em; font-weight: 300; letter-spacing: 1px;">
  by Lic en Info 1000
</footer>
</html>
