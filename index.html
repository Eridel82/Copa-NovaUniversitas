<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa NovaUniversitas 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0d0f14;
    --bg2:       #131620;
    --bg3:       #1a1e2b;
    --surface:   #1e2235;
    --border:    rgba(255,255,255,0.07);
    --blue:      #4f8ef7;
    --blue-dim:  rgba(79,142,247,0.12);
    --pink:      #f472b6;
    --pink-dim:  rgba(244,114,182,0.12);
    --gold:      #f59e0b;
    --silver:    #94a3b8;
    --bronze:    #c87533;
    --text:      #e8eaf0;
    --text-dim:  #8b92a8;
    --text-muted:#4a5068;
    --green:     #34d399;
    --radius:    16px;
    --radius-sm: 10px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── NOISE TEXTURE OVERLAY ── */
  body::before {
    content:'';
    position:fixed; inset:0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events:none; z-index:0;
  }

  /* ── GLOW ORBS ── */
  .orb {
    position:fixed;
    border-radius:50%;
    filter:blur(120px);
    pointer-events:none;
    z-index:0;
    opacity:.35;
  }
  .orb-1 { width:600px; height:600px; background:#4f8ef7; top:-200px; left:-200px; animation: orbDrift 18s ease-in-out infinite; }
  .orb-2 { width:500px; height:500px; background:#f472b6; bottom:-150px; right:-150px; animation: orbDrift 22s ease-in-out 4s infinite reverse; }
  .orb-3 { width:300px; height:300px; background:#7c3aed; top:50%; left:50%; transform:translate(-50%,-50%); opacity:.2; animation: orbDrift 28s ease-in-out 8s infinite; }

  .page-wrap { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:0 20px 80px; }

  /* ── HERO ── */
  .hero {
    padding: 80px 20px 60px;
    text-align: center;
    position: relative;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(79,142,247,0.15);
    border: 1px solid rgba(79,142,247,0.3);
    color: var(--blue);
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 28px;
    animation: fadeIn 0.8s ease both;
  }

  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.5));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    animation: slideUp 0.8s ease 0.1s both;
  }

  .hero-year {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 600;
    color: var(--blue);
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 20px;
    animation: slideUp 0.8s ease 0.2s both;
  }

  .hero-sub {
    color: var(--text-dim);
    font-size: 1.05rem;
    font-weight: 300;
    letter-spacing: 0.5px;
    animation: slideUp 0.8s ease 0.3s both;
  }

  .hero-divider {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, var(--blue), var(--pink));
    margin: 32px auto;
    border-radius: 2px;
    animation: fadeIn 1s ease 0.4s both;
  }

  /* ── LIVE INDICATOR ── */
  .live-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 60px;
    animation: fadeIn 1s ease 0.5s both;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 100px;
    font-size: 0.88rem;
  }

  .stat-pill .n { font-family:'Syne',sans-serif; font-weight:700; font-size:1.1rem; color:var(--blue); }
  .stat-pill.fem .n { color:var(--pink); }
  .stat-pill .l { color:var(--text-dim); }

  /* ── SECTION TITLES ── */
  .sec-title {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  .sec-title h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .sec-title .line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .sec-tag {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--blue);
    background: var(--blue-dim);
    border: 1px solid rgba(79,142,247,0.2);
    padding: 4px 12px;
    border-radius: 100px;
  }

  .sec-tag.fem { color:var(--pink); background:var(--pink-dim); border-color:rgba(244,114,182,0.2); }

  /* ── CARDS WRAPPER ── */
  .section-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px;
    margin-bottom: 28px;
  }

  /* ── PARTIDOS ── */
  .jornada-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin: 0 0 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .jornada-header h3 {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .jornada-fecha {
    font-size: 0.82rem;
    color: var(--blue);
    font-weight: 500;
  }

  .partidos-grid {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 32px;
  }

  .partido-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 40px;
    position: relative;
    overflow: hidden;
    transition: border-color .3s, transform .3s, box-shadow .3s;
    animation: cardSlideIn .5s ease both;
  }

  /* shimmer sweep on hover */
  .partido-card::before {
    content:'';
    position:absolute;
    top:0; left:-100%; width:60%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    transition: left .6s ease;
    pointer-events:none;
  }
  .partido-card:hover::before { left:150%; }

  /* glow accent top */
  .partido-card::after {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:2px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    border-radius:20px 20px 0 0;
  }

  .partido-card.femenino::after {
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
  }

  .partido-card:hover {
    border-color: rgba(79,142,247,0.35);
    transform: translateY(-3px);
    box-shadow: 0 20px 60px rgba(79,142,247,0.12);
  }

  .partido-card.femenino:hover {
    border-color: rgba(244,114,182,0.35);
    box-shadow: 0 20px 60px rgba(244,114,182,0.12);
  }

  /* BG blob inside card */
  .partido-card .card-blob {
    position:absolute;
    right:-60px; top:-60px;
    width:220px; height:220px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(79,142,247,0.08), transparent 70%);
    pointer-events:none;
  }

  .partido-card.femenino .card-blob {
    background: radial-gradient(circle, rgba(244,114,182,0.08), transparent 70%);
  }

  .cat-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .cat-label::before {
    content:'';
    display:inline-block;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--blue);
    animation: pulse 2s infinite;
  }

  .femenino .cat-label { color: var(--pink); }
  .femenino .cat-label::before { background: var(--pink); }

  .partido-equipos {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 32px;
  }

  .equipo-col { flex:1; }
  .equipo-col.right { text-align:right; }

  .equipo-emoji { font-size:3rem; display:block; margin-bottom:10px; line-height:1; }
  .equipo-col.right .equipo-emoji { display:block; }

  .equipo-nombre {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    color: var(--text);
    line-height: 1.2;
    letter-spacing: -0.3px;
  }

  .vs-orb {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--bg3);
    border: 1px solid var(--border);
    display: flex; align-items:center; justify-content:center;
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 1px;
    flex-shrink: 0;
    position: relative;
  }

  .vs-orb::before {
    content:'';
    position:absolute; inset:-4px;
    border-radius:50%;
    background: conic-gradient(var(--blue) 0%, transparent 40%, transparent 60%, var(--pink) 100%);
    opacity: .3;
    animation: spinSlow 6s linear infinite;
  }

  .partido-meta {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    color: var(--text-dim);
    background: var(--bg3);
    padding: 8px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
  }

  .meta-icon { font-size: 0.95rem; }

  /* ── TABLA POSICIONES ── */
  .tablas-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
    gap: 28px;
    margin-bottom: 28px;
  }

  .tabla-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
  }

  .tabla-top {
    padding: 22px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .tabla-top h3 {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: -0.3px;
  }

  table { width:100%; border-collapse:collapse; }

  thead th {
    padding: 12px 16px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: center;
    background: var(--bg3);
  }

  thead th:nth-child(2) { text-align:left; padding-left:20px; }

  tbody td {
    padding: 14px 16px;
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-dim);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  tbody td:nth-child(2) { text-align:left; padding-left:20px; }

  tbody tr { transition: background .2s; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }

  tbody tr:last-child td { border-bottom: none; }

  .pos-num {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.88rem;
    color: var(--text-muted);
  }

  .equipo-td {
    display:flex; align-items:center; gap:10px;
    font-weight:500; color:var(--text);
    font-size: 0.9rem;
  }

  .pos-dot {
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
  }

  .pts-td {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--blue);
  }

  .tabla-card.fem .pts-td { color: var(--pink); }

  .dg-pos { color: var(--green); }
  .dg-neg { color: #f87171; }
  .dg-zero { color: var(--text-muted); }

  /* leader row */
  .leader-row td { background: rgba(79,142,247,0.06); }
  .fem-leader-row td { background: rgba(244,114,182,0.06); }

  /* ── GOLEADORES ── */
  .goles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
    gap: 28px;
    margin-bottom: 28px;
  }

  .goles-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
  }

  .goles-top {
    padding: 22px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .goles-top h3 {
    font-family:'Syne', sans-serif;
    font-weight:700; font-size:1rem;
  }

  .goles-list { padding: 12px 0; }

  .gol-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 28px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background .2s;
    position: relative;
    overflow: hidden;
  }

  .gol-row:last-child { border-bottom: none; }
  .gol-row:hover { background: rgba(255,255,255,0.03); }

  /* top 3 shimmer */
  .gol-row.rank-1::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(245,158,11,0.08), transparent 50%);
    pointer-events:none;
  }
  .gol-row.rank-2::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(148,163,184,0.06), transparent 50%);
    pointer-events:none;
  }
  .gol-row.rank-3::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(200,117,51,0.06), transparent 50%);
    pointer-events:none;
  }

  .rank-badge {
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Syne',sans-serif; font-weight:700; font-size:0.82rem;
    flex-shrink:0;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .rank-1 .rank-badge { background:rgba(245,158,11,0.15); border-color:rgba(245,158,11,0.4); color:var(--gold); }
  .rank-2 .rank-badge { background:rgba(148,163,184,0.15); border-color:rgba(148,163,184,0.4); color:var(--silver); }
  .rank-3 .rank-badge { background:rgba(200,117,51,0.15); border-color:rgba(200,117,51,0.4); color:var(--bronze); }

  .gol-info { flex:1; min-width:0; }
  .gol-name { font-weight:600; color:var(--text); font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gol-team { font-size:0.78rem; color:var(--text-muted); margin-top:2px; }

  .gol-count {
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-width:64px; height:64px;
    border-radius:14px;
    background: var(--bg3);
    border: 1px solid rgba(79,142,247,0.25);
    position:relative;
    overflow:hidden;
  }

  .gol-count::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(79,142,247,0.1), transparent);
    pointer-events:none;
  }

  .goles-card.fem .gol-count {
    border-color: rgba(244,114,182,0.25);
  }

  .goles-card.fem .gol-count::before {
    background: linear-gradient(135deg, rgba(244,114,182,0.1), transparent);
  }

  .gol-count .gol-num {
    font-family:'Syne',sans-serif;
    font-weight:800;
    font-size:1.8rem;
    line-height:1;
    color:var(--blue);
    position:relative; z-index:1;
  }

  .goles-card.fem .gol-count .gol-num { color:var(--pink); }

  .gol-count .gol-lbl {
    font-size:0.58rem;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-muted);
    position:relative; z-index:1;
    margin-top:2px;
  }

  .rank-1 .gol-count {
    border-color: rgba(245,158,11,0.4);
    background: rgba(245,158,11,0.08);
  }
  .rank-1 .gol-count::before { background: linear-gradient(135deg, rgba(245,158,11,0.15), transparent); }
  .rank-1 .gol-count .gol-num { color: var(--gold); }

  .rank-2 .gol-count {
    border-color: rgba(148,163,184,0.35);
    background: rgba(148,163,184,0.07);
  }
  .rank-2 .gol-count .gol-num { color: var(--silver); }

  .rank-3 .gol-count {
    border-color: rgba(200,117,51,0.35);
    background: rgba(200,117,51,0.07);
  }
  .rank-3 .gol-count .gol-num { color: var(--bronze); }

  .gol-bar-wrap {
    flex:1;
    height:5px;
    background:var(--bg3);
    border-radius:3px;
    overflow:hidden;
    max-width:100px;
  }

  .gol-bar {
    height:100%;
    border-radius:3px;
    background: linear-gradient(90deg, var(--blue), #818cf8);
    transition: width .8s cubic-bezier(.23,1,.32,1);
  }

  .goles-card.fem .gol-bar { background: linear-gradient(90deg, var(--pink), #e879f9); }

  /* no data */
  .empty-state {
    padding: 48px 28px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .empty-state .e-icon { font-size: 2.5rem; margin-bottom: 12px; display:block; opacity:.4; }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 0.82rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }

  footer::before {
    content:'';
    display:block;
    width:40px; height:1px;
    background: var(--border);
    margin: 0 auto 20px;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeIn    { from{opacity:0}                        to{opacity:1} }
  @keyframes slideUp   { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  @keyframes cardSlideIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes spinSlow  { from{transform:rotate(0deg)}           to{transform:rotate(360deg)} }
  @keyframes pulse     {
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.5;transform:scale(.75)}
  }
  @keyframes countUp  {
    from{opacity:0;transform:scale(.6) translateY(8px)}
    to  {opacity:1;transform:scale(1)  translateY(0)}
  }
  @keyframes glowPulse {
    0%,100%{box-shadow:0 0 0 0 rgba(79,142,247,0)}
    50%    {box-shadow:0 0 24px 4px rgba(79,142,247,0.18)}
  }
  @keyframes glowPulseFem {
    0%,100%{box-shadow:0 0 0 0 rgba(244,114,182,0)}
    50%    {box-shadow:0 0 24px 4px rgba(244,114,182,0.18)}
  }
  @keyframes heroFloat {
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  @keyframes orbDrift {
    0%,100%{transform:translate(0,0)}
    33%{transform:translate(30px,-20px)}
    66%{transform:translate(-20px,30px)}
  }

  .fade-in { animation: fadeIn .6s ease both; }

  /* scroll-reveal */
  .reveal {
    opacity:0;
    transform:translateY(30px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .reveal.visible {
    opacity:1;
    transform:translateY(0);
  }

  .gol-count { animation: countUp .5s ease both; }

  .rank-1 .gol-count { animation: countUp .4s ease .05s both, glowPulse 3s ease 1s infinite; }
  .goles-card.fem .rank-1 .gol-count { animation: countUp .4s ease .05s both, glowPulseFem 3s ease 1s infinite; }

  .hero-badge { animation: fadeIn .8s ease both; }

  /* float the trophy badge */
  .hero-badge { animation: fadeIn .8s ease both, heroFloat 4s ease 1s infinite; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface); border-radius:3px; }

  /* ── RESPONSIVE ── */

  /* Tablet */
  @media(max-width:900px){

/* ══════════════════════════════════════════════
   ⚙️ CÁLCULO
══════════════════════════════════════════════ */
function calcularTabla(nombresEquipos, grupoNombre) {
  const tabla = nombresEquipos.map(n => ({
    nombre:n, pj:0, pg:0, pe:0, pp:0, gf:0, gc:0, dg:0, puntos:0, enf:{}
  }));

  resultadosPartidos.filter(r => r.grupo === grupoNombre).forEach(r => {
    const e1 = tabla.find(e => e.nombre === r.equipo1);
    const e2 = tabla.find(e => e.nombre === r.equipo2);
    if (!e1) return;
    if (!e2) {
      e1.pj++; e1.gf += r.goles1; e1.gc += (r.goles2||0); e1.pg++; e1.puntos += 3; return;
    }
    e1.pj++; e2.pj++;
    e1.gf += r.goles1; e1.gc += r.goles2;
    e2.gf += r.goles2; e2.gc += r.goles1;

    if (r.goles1 > r.goles2)      { e1.pg++; e1.puntos+=3; e2.pp++; e1.enf[e2.nombre]='W'; e2.enf[e1.nombre]='L'; }
    else if (r.goles1 < r.goles2) { e2.pg++; e2.puntos+=3; e1.pp++; e2.enf[e1.nombre]='W'; e1.enf[e2.nombre]='L'; }
    else                           { e1.pe++; e2.pe++; e1.puntos+=2; e2.puntos++; e1.enf[e2.nombre]='D'; e2.enf[e1.nombre]='D';,console.log(`Empate entre ${e1.nombre} y ${e2.nombre}, puntos: ${e1.puntos}-${e2.puntos}`); }
  });

  tabla.forEach(e => e.dg = e.gf - e.gc);
  tabla.sort((a,b) => {
    if (b.puntos !== a.puntos) return b.puntos - a.puntos;
    if (b.dg     !== a.dg)     return b.dg - a.dg;
    if (b.gf     !== a.gf)     return b.gf - a.gf;
    if (a.enf[b.nombre]) return a.enf[b.nombre]==='W'?-1:a.enf[b.nombre]==='L'?1:0;
    return 0;
  });
  return tabla;
}

// TABLA POSICIONES
function renderTabla(tabla, titulo, isFem) {
  const rowClass   = isFem ? 'fem-leader-row' : 'leader-row';

  const rows = tabla.map((e, i) => {
    const dot   = dotColors[e.nombre] || '#4f8ef7';
    const dgFmt = e.dg > 0 ? `<span class="dg-pos">+${e.dg}</span>` : e.dg < 0 ? `<span class="dg-neg">${e.dg}</span>` : `<span class="dg-zero">0</span>`;
    return `
      <tr class="${i===0 ? rowClass : ''}">
        <td><span class="pos-num">${i+1}</span></td>
        <td>
          <div class="equipo-td">
            <div class="pos-dot" style="background:${dot};"></div>
            ${e.nombre}
          </div>
        </td>
        <td>${e.gf}</td>
        <td>${e.gc}</td>
        <td>${dgFmt}</td>
        <td class="pts-td">${e.puntos}</td>
      </tr>`;
  }).join('');

  return `
    <div class="${cardClass}">
      <div class="tabla-top">

        <span class="${tagClass}">${tagIcon} ${isFem ? 'Femenil' : 'Varonil'}</span>

            <th>GF</th>
            <th>GC</th>
            <th>DG</th>
            <th>PTS</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// GOLEADORES
function renderGoleadores(arr, titulo, isFem) {
  arr = [...arr].sort((a,b) => b.goles - a.goles);
  const max = arr.length ? arr[0].goles : 1;
  const cardClass = isFem ? 'goles-card fem' : 'goles-card';
  const tagClass  = isFem ? 'sec-tag fem' : 'sec-tag';
  const tagIcon   = isFem ? '👩' : '⚽';
  const rankMap   = ['rank-1','rank-2','rank-3'];

  let body = '';
  if (!arr.length) {
    body = `<div class="empty-state"><span class="e-icon">⚽</span>Sin goles registrados aún</div>`;
  } else {
    body = `<div class="goles-list">` +
      arr.slice(0,10).map((g,i) => {
        const rankCls = rankMap[i] || '';
        const pct     = Math.round((g.goles/max)*100);
        const medal   = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
        return `
          <div class="gol-row ${rankCls}" style="animation-delay:${i*0.08}s">
            <div class="rank-badge">${medal}</div>
            <div class="gol-info">
              <div class="gol-name">${g.nombre}</div>
              <div class="gol-team">${g.equipo}</div>
            </div>
            <div class="gol-bar-wrap">
              <div class="gol-bar" style="width:0%" data-width="${pct}%"></div>

            <div class="gol-count">
              <span class="gol-num">${g.goles}</span>
              <span class="gol-lbl">${g.goles === 1 ? 'gol' : 'goles'}</span>
            </div>
          </div>`;
      }).join('') + `</div>`;
  }

  return `
    <div class="${cardClass}">
      <div class="goles-top">
        <h3>${titulo}</h3>
        <span class="${tagClass}">${tagIcon} ${isFem ? 'Femenil' : 'Varonil'}</span>
      </div>
      ${body}
    </div>`;
}

// PARTIDOS
function renderPartidos() {

          </div>
        </div>`;
    });

    html += `</div>`;
  });

  document.getElementById('contenedorJornadas').innerHTML = html;
}

// LIVE BAR
function renderLiveBar(tablaV, tablaF) {
  const totalGolesV = tablaV.reduce((s,e)=>s+e.gf,0);

}

/* ══════════════════════════════════════════════
   🚀 INIT
══════════════════════════════════════════════ */

// Add reveal class to section cards
document.querySelectorAll('.section-card, .tabla-card, .goles-card, .section-card').forEach(el => {
  el.classList.add('reveal');
});

// Scroll-reveal observer
const revealObs = new IntersectionObserver((entries) => {
  entries.forEach((entry, i) => {
    if (entry.isIntersecting) {
      setTimeout(() => entry.target.classList.add('visible'), i * 80);
      revealObs.unobserve(entry.target);
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.reveal').forEach(el => revealObs.observe(el));

// Animate bars after short delay using data-width
setTimeout(() => {
  document.querySelectorAll('.gol-bar[data-width]').forEach(b => {
